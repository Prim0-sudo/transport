<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Departure Signal preview</title>
<style>
  :root{--ink:#183a51;--card:#f6fbff;--line:#b9cfdf}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:#dfeaf2;color:var(--ink);font:16px/1.4 system-ui,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:16px}
  main{width:min(980px,100%);background:var(--card);border-radius:24px;padding:clamp(12px,2.4vw,24px);box-shadow:0 10px 30px #183a5126;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:1.15rem}
  p.note{margin:0;font-size:.9rem;opacity:.8}
  .scene{position:relative;width:min(100%,calc((100dvh - 260px)*1.5));margin-inline:auto;aspect-ratio:3/2;overflow:hidden;border-radius:20px;border:4px solid #fff;box-shadow:0 7px 0 #a9c3d6,0 13px 24px #183a5124;background:#a8d2ef}
  .scene>img.backplate{position:absolute;inset:0;width:100%;height:100%;display:block}
  .lamp{position:absolute;width:4.62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
  .lamp i{position:absolute;inset:0;border-radius:50%}
  .lamp .green{background:radial-gradient(circle at 38% 34%,#eaffea 0 12%,#58e07a 30%,#16a246 62%,#0b6b2c 100%);box-shadow:0 0 1.2vw .3vw #4fe07a99}
  .lamp .red{background:radial-gradient(circle at 38% 34%,#ffecec 0 12%,#ff6a5c 30%,#d8261b 62%,#8b130c 100%);box-shadow:0 0 1.2vw .3vw #ff5a4a99;opacity:0}
  .lamp .flash{inset:-45%;border:.35vw solid #ff7a6b;opacity:0}
  .train{position:absolute;left:13%;top:48.9%;width:72%;will-change:transform}
  .train img{width:100%;display:block}
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  button{font:inherit;font-weight:800;color:var(--ink);min-height:46px;padding:10px 16px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;cursor:pointer}
  button.primary{background:#2c9b5a;border-color:#1f7744;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  label{display:inline-flex;align-items:center;gap:8px;font-weight:700;min-height:46px}
  .status{text-align:center;font-weight:800;margin:0}
  @media(max-width:480px){body{padding:8px}button{flex:1 1 40%;padding:8px 10px}}
</style>
</head>
<body>
<main>
  <h1>Spelling scene preview: Departure signal</h1>
  <p class="note">Movement preview only. The backplate and train are draft paintings; final art gets separate layers, turning wheels and painted lamps.</p>
  <div class="scene" id="scene" role="img" aria-label="Train waiting under eight signal lamps">
    <img class="backplate" src="backplate.webp" alt="">
    <div class="train" id="train"><img src="train.png" alt=""></div>
  </div>
  <p class="status" id="status" aria-live="polite">0 / 8 wrong guesses</p>
  <div class="controls">
    <button id="wrong">Wrong guess</button>
    <button id="win" class="primary">Spell it right</button>
    <button id="next">Next word</button>
    <label><input type="checkbox" id="reduce"> Reduced motion</label>
  </div>
</main>
<script src="../../../site/dist/vendor/gsap.min.js"></script>
<script>
// Lamp centres measured from backplate.webp (1536 x 1024): x 295..1075, y 196..202, 71 px across.
const LAMPS=[[295,201],[407,202],[518,201],[629,200],[741,200],[851,198],[963,197],[1075,196]];
const scene=document.getElementById('scene'),trainEl=document.getElementById('train'),statusEl=document.getElementById('status');
const buttons={wrong:document.getElementById('wrong'),win:document.getElementById('win'),next:document.getElementById('next')};
const reduceBox=document.getElementById('reduce'),mq=matchMedia('(prefers-reduced-motion: reduce)');
reduceBox.checked=mq.matches;
const reduced=()=>reduceBox.checked;
const lamps=LAMPS.map(([x,y])=>{const el=document.createElement('div');el.className='lamp';el.style.left=x/1536*100+'%';el.style.top=y/1024*100+'%';el.innerHTML='<i class="green"></i><i class="red"></i><i class="flash"></i>';scene.append(el);return{el,green:el.children[0],red:el.children[1],flash:el.children[2]};});
let misses=0,state='play',ctx=gsap.context(()=>{},scene);

function setLamp(l,red){gsap.set(l.red,{opacity:red?1:0,scale:1});gsap.set(l.green,{opacity:red?0:1,scale:1});}
function refresh(){statusEl.textContent=state==='won'?'Spelled! The train departs.':state==='lost'?'8 / 8 wrong guesses. The train stays.':`${misses} / 8 wrong guesses`;buttons.wrong.disabled=buttons.win.disabled=state!=='play';}

function wrongGuess(){
  if(state!=='play')return;const l=lamps[misses++];
  ctx.add(()=>{
    if(reduced()){setLamp(l,true);}
    else{
      gsap.timeline()
        .to(l.green,{scale:.6,opacity:0,duration:.18,ease:'power2.in'})
        .fromTo(l.red,{scale:.5,opacity:0},{scale:1,opacity:1,duration:.35,ease:'back.out(3)'},'<.1')
        .fromTo(l.flash,{scale:.6,opacity:.9},{scale:1.4,opacity:0,duration:.5,ease:'power1.out'},'<')
        // the train gives a small impatient shudder on its rails
        .fromTo(trainEl,{x:0},{x:'0.35%',duration:.06,repeat:5,yoyo:true,ease:'sine.inOut'},'<');
    }
  });
  if(misses>=8)lose();refresh();
}
function win(){
  if(state!=='play')return;state='won';refresh();
  ctx.add(()=>{
    if(reduced()){lamps.forEach(l=>setLamp(l,false));gsap.to(trainEl,{opacity:0,duration:.4});return;}
    const tl=gsap.timeline();
    // green wave left to right, then the train pulls away and leaves the frame
    lamps.forEach((l,i)=>tl.to(l.red,{opacity:0,duration:.15},i*.08).fromTo(l.green,{scale:.6,opacity:0},{scale:1,opacity:1,duration:.3,ease:'back.out(3)'},i*.08));
    gsap.killTweensOf(trainEl);gsap.set(trainEl,{x:0});
    tl.to(trainEl,{xPercent:6,duration:.5,ease:'power1.in'},'+=.25')
      .to(trainEl,{xPercent:140,duration:1.6,ease:'power2.in'});
  });
}
function lose(){
  state='lost';
  ctx.add(()=>{
    if(reduced())return;
    // every lamp pulses red together; the train settles back, staying at the platform
    gsap.timeline({delay:.4}).to(lamps.map(l=>l.red),{scale:1.15,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'})
      .to(trainEl,{x:0,duration:.2},'<');
  });
}
function nextWord(){
  ctx.revert();ctx=gsap.context(()=>{},scene);
  misses=0;state='play';lamps.forEach(l=>{setLamp(l,false);gsap.set(l.flash,{opacity:0});});
  gsap.set(trainEl,{x:0,xPercent:0,opacity:1});refresh();
  ctx.add(()=>{
    if(reduced()){gsap.from(trainEl,{opacity:0,duration:.4});return;}
    // a new train rolls in from the left and brakes at the platform
    gsap.from(trainEl,{xPercent:-140,duration:1.8,ease:'power3.out'});
  });
}
buttons.wrong.onclick=wrongGuess;buttons.win.onclick=win;buttons.next.onclick=nextWord;
// Switching reduced motion mid-move jumps running motion to its end state.
const settle=()=>{if(reduced())ctx.getTweens().forEach(t=>t.progress(1));};
reduceBox.onchange=settle;
mq.addEventListener('change',e=>{reduceBox.checked=e.matches;settle();});
// Hidden tab hold: freeze, then resume without catching up.
document.addEventListener('visibilitychange',()=>{document.hidden?gsap.globalTimeline.pause():gsap.globalTimeline.resume();});
nextWord();
</script>
</body>
</html>
